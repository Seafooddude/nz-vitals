name: Update data

on:
  schedule:
    - cron: "0 19 * * *"   # daily, 19:00 UTC (early morning NZ)
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch and validate data
        env:
          STATSNZ_API_KEY: ${{ secrets.STATSNZ_API_KEY }}
        run: python scripts/update_data.py
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/data.json sitemap.xml
          git diff --cached --quiet || git commit -m "Update data" && git push
